<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>暖心語</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="glow glow-a"></div><div class="glow glow-b"></div><div class="paper"></div>
  <div class="shell">
    <header class="top">
      <div class="brand"><span class="mark">◌</span><div><h1>暖心語</h1><p class="tag">我在</p></div></div>
      <nav class="tabs">
        <button type="button" class="tab is-on" data-view="talk">對話</button>
        <button type="button" class="tab" data-view="breathe">呼吸</button>
        <button type="button" class="tab" data-view="soup">一碗湯</button>
        <button type="button" class="tab" data-view="journal">小記</button>
      </nav>
    </header>
    <main>
      <section id="view-talk" class="view is-on chat-view">
        <div class="thread" id="thread"></div>
        <div class="composer">
          <div class="moods">
            <button type="button" class="chip" data-mood="tired" data-seed="今天好累。">好累</button>
            <button type="button" class="chip" data-mood="sad" data-seed="心裡難過。">難過</button>
            <button type="button" class="chip" data-mood="anxious" data-seed="有點焦慮。">焦慮</button>
            <button type="button" class="chip" data-mood="lonely" data-seed="覺得孤單。">孤單</button>
            <button type="button" class="chip" data-mood="angry" data-seed="有點委屈。">委屈</button>
            <button type="button" class="chip" data-mood="lost" data-seed="有點迷惱。">迷惱</button>
          </div>
          <form id="talk-form" class="bar">
            <textarea id="feel" rows="1" placeholder="跟我說…"></textarea>
            <button type="submit" class="send">送出</button>
          </form>
          <div class="bar-meta">
            <button type="button" class="text-btn" id="find-song">替我找一首歌</button>
            <button type="button" class="text-btn" id="new-chat">新的一輪</button>
          </div>
        </div>
      </section>
      <section id="view-breathe" class="view">
        <div class="breath-wrap"><div class="orb-stage"><div class="orb-glow"></div><div class="orb" id="orb"><span class="orb-shine"></span><span class="orb-rim"></span><span id="orb-word">準備</span></div></div>
        <button type="button" class="btn" id="breath-toggle">開始呼吸</button></div>
      </section>
      <section id="view-soup" class="view"><p id="soup-text"></p><cite id="soup-cite"></cite><button type="button" class="btn" id="next-soup">再盛一勺</button></section>
      <section id="view-journal" class="view"><div id="journal-list"></div></section>
    </main>
  </div>
  <script src="app.js"></script>
</body></html>
